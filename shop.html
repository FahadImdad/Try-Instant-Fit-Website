<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue — Try Instant Fit</title>
  <meta name="description" content="Browse the collection and try any item on with your photo.">
  <!-- Absolute asset paths — this page is served at a multi-segment clean URL
       (/shop/:brandId), so relative paths would 404. -->
  <link rel="icon" type="image/jpeg" href="/assets/website-icon.png">
  <link rel="apple-touch-icon" href="/assets/website-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <!-- Cormorant: elegant serif for the brand identity (luxury fashion feel).
       Body/UI stays Inter from the shared stylesheet. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Brand theme variables — overridden at runtime from the brand's
       primary_color. Defaults keep the standard Try Instant Fit look. */
    :root {
      --brand: #5a67f2;                 /* brand accent (buttons, price, active chips) */
      --brand-dark: #4a56d0;            /* darker shade for hovers/gradients */
      --brand-contrast: #ffffff;        /* text on top of the brand colour */
      --page-bg-a: #0f1e3d;
      --serif: 'Cormorant', Georgia, serif;
      --ease-out: cubic-bezier(.22, .68, .31, 1);
    }
    * { -webkit-tap-highlight-color: transparent; }
    body { background: var(--page-bg-a); min-height: 100vh; }
    .shop-wrap { max-width: 720px; margin: 0 auto; padding: 0 .7rem 3rem; }

    /* ── App bar — slim, sticky, glass. Brand name in elegant serif. ── */
    .shop-appbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: .6rem;
      padding: .55rem .2rem; margin-bottom: .35rem;
      background: color-mix(in srgb, var(--page-bg-a) 82%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.09);
    }
    .shop-back {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.1); color: #fff; border: none;
      cursor: pointer; text-decoration: none; transition: background .15s;
    }
    .shop-back:hover { background: rgba(255,255,255,.2); }
    .shop-back svg { width: 18px; height: 18px; }
    .shop-brand-logo { height: 32px; width: 32px; object-fit: contain; border-radius: 9px; background: #fff; flex: 0 0 auto; display: none; }
    .shop-brand {
      color: #fff; font-family: var(--serif); font-size: 1.45rem; font-weight: 700;
      margin: 0; line-height: 1; letter-spacing: .02em; flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .shop-visit {
      flex: 0 0 auto; padding: .42rem .8rem; border-radius: var(--r-full);
      font-size: .72rem; font-weight: 700; text-decoration: none;
      background: color-mix(in srgb, var(--brand) 26%, transparent);
      color: #fff; border: 1px solid color-mix(in srgb, var(--brand) 45%, transparent);
      transition: background .15s;
    }
    .shop-visit:hover { background: color-mix(in srgb, var(--brand) 40%, transparent); }

    /* ── Controls — flat on the dark bg, app-like. ── */
    .shop-controls { padding: .35rem .1rem .6rem; margin-bottom: .5rem; }
    .search-wrap { position: relative; margin-bottom: .6rem; }
    .search-wrap svg {
      position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: #7c8598; pointer-events: none;
    }
    .shop-search {
      width: 100%; box-sizing: border-box; padding: .72rem .9rem .72rem 2.4rem;
      border: none; border-radius: 12px; font-size: 1rem; font-family: inherit; outline: none;
      background: rgba(255,255,255,.95); color: var(--text);
      transition: box-shadow .2s var(--ease-out);
    }
    .shop-search:focus { box-shadow: 0 0 0 2px var(--brand); }
    .shop-search::placeholder { color: #94a3b8; }

    .filter-row { margin-bottom: .45rem; }
    .filter-label { display: none; }
    .chip-row { display: flex; gap: .4rem; overflow-x: auto; padding-bottom: .15rem; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; padding: .42rem .85rem; border: 1px solid rgba(255,255,255,.16);
      border-radius: var(--r-full); background: rgba(255,255,255,.07); font-size: .8rem; font-weight: 600;
      color: rgba(255,255,255,.88); cursor: pointer; white-space: nowrap; font-family: inherit;
      transition: background .18s var(--ease-out), border-color .18s, color .18s, transform .12s;
    }
    .chip:hover { border-color: rgba(255,255,255,.4); }
    .chip:active { transform: scale(.95); }
    .chip.active { background: var(--brand); border-color: var(--brand); color: var(--brand-contrast); }

    .shop-toolbar { display: flex; justify-content: space-between; align-items: center; gap: .6rem; margin-top: .45rem; }
    .shop-count { font-size: .78rem; color: rgba(255,255,255,.55); }
    /* Sort — native <select> paints itself dark on some Chromium builds no
       matter what CSS says (verified via computed-style vs pixel forensics).
       Bulletproof pattern: a styled pill with the select stretched invisibly
       on top — our pixels, native picker UX. */
    .sort-wrap {
      position: relative; display: inline-flex; align-items: center; gap: .4rem;
      background: #fff; color: var(--text); border-radius: 10px;
      padding: .48rem .8rem; font-size: .8rem; font-weight: 600;
    }
    .sort-wrap > svg { width: 12px; height: 12px; color: #64748b; flex: 0 0 auto; }
    .sort-wrap select {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer; font-size: 16px; /* no iOS zoom on focus */
    }
    .shop-search { color-scheme: light; }

    /* ── Grid — cards size to their own content. ── */
    .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; align-items: start; }
    @media (min-width: 560px) { .shop-grid { grid-template-columns: repeat(3, 1fr); gap: .75rem; } }
    @media (min-width: 820px) { .shop-grid { grid-template-columns: repeat(4, 1fr); } }

    /* Staggered entrance — transform/opacity only (60fps), 40ms per card,
       cap handled in JS. Disabled under prefers-reduced-motion (global layer). */
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }
    .card {
      background: #fff; border-radius: 14px; overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,.25), 0 8px 24px rgba(0,0,0,.18);
      transition: transform .15s var(--ease-out);
      animation: cardIn .5s var(--ease-out) both;
      animation-delay: calc(var(--i, 0) * 42ms);
    }
    .card:active { transform: scale(.975); }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

    /* Image frame — BULLETPROOF fill: the frame owns the 3/4 ratio and the
       image absolutely fills it (immune to global img rules). No letterboxing. */
    /* White frame: many vendor photos have white padding baked into the file,
       so a white background makes them blend seamlessly (standard marketplace
       "product on white" look) instead of reading as a letterbox. */
    .card-media {
      position: relative; display: block; aspect-ratio: 3 / 4;
      overflow: hidden; background: #fff;
    }
    .card-media img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      opacity: 0; transition: opacity .45s var(--ease-out);
    }
    .card-media img.loaded { opacity: 1; }
    .card-media .ph {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, color-mix(in srgb, var(--brand) 75%, #000), var(--brand));
      color: rgba(255,255,255,.85);
    }
    .card-media .ph svg { width: 34px; height: 34px; }

    .card-body { padding: .55rem .6rem .6rem; display: flex; flex-direction: column; }
    .card-cat {
      font-size: .58rem; font-weight: 700; color: #94a3b8; margin: 0 0 .12rem;
      text-transform: uppercase; letter-spacing: .09em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .card-name {
      font-size: .8rem; font-weight: 600; color: var(--text); line-height: 1.32; margin: 0 0 .18rem;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-price {
      font-size: .84rem; font-weight: 800; color: var(--brand); margin: 0 0 .5rem;
      font-variant-numeric: tabular-nums;
    }
    .card-actions { display: flex; flex-direction: column; gap: .38rem; }
    .card-btn {
      width: 100%; box-sizing: border-box; padding: .55rem .4rem; border-radius: 9px;
      font-size: .79rem; font-weight: 700; cursor: pointer; font-family: inherit;
      text-decoration: none; display: flex; align-items: center; justify-content: center; gap: .35rem;
      border: none; transition: filter .15s, transform .12s; white-space: nowrap;
    }
    .card-btn svg { width: 14px; height: 14px; flex: 0 0 auto; }
    .card-btn:active { transform: scale(.97); }
    .card-btn.try {
      background: linear-gradient(135deg, var(--brand), var(--brand-dark));
      color: var(--brand-contrast);
      box-shadow: 0 3px 10px color-mix(in srgb, var(--brand) 35%, transparent);
    }
    .card-btn.try:hover { filter: brightness(1.08); }
    .card-btn.buy { background: #fff; color: #15803d; border: 1.5px solid #16a34a; padding: .48rem .4rem; }
    .card-btn.buy:hover { background: #f0fdf4; }

    /* ── Skeleton loading — shimmer grid instead of a blocking spinner. ── */
    @keyframes shimmer { to { background-position: -200% 0; } }
    .skel-card { background: rgba(255,255,255,.05); border-radius: 14px; overflow: hidden; }
    .skel-media { aspect-ratio: 3 / 4; }
    .skel-line { height: 10px; border-radius: 6px; margin: .55rem .6rem; }
    .skel-line.short { width: 45%; }
    .skel-btn { height: 30px; border-radius: 9px; margin: .3rem .6rem .6rem; }
    .skel-media, .skel-line, .skel-btn {
      background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.13) 50%, rgba(255,255,255,.05) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }

    /* States */
    .shop-state { text-align: center; color: #fff; padding: 3rem 1rem; }
    .shop-state svg { width: 44px; height: 44px; color: rgba(255,255,255,.5); margin-bottom: .75rem; }
    .shop-empty { text-align: center; color: rgba(255,255,255,.7); padding: 2.5rem 1rem; font-size: .95rem; }
    .shop-empty .chip { margin-top: .85rem; }

    .shop-footer { text-align: center; color: rgba(255,255,255,.45); font-size: .75rem; padding: 2rem 1rem 0; }
    .shop-footer a { color: rgba(255,255,255,.7); }
    img { max-width: 100%; }
  </style>
</head>
<body>

<div class="shop-wrap">

  <!-- App-style top bar: back · brand logo + name (serif) · visit store. Sticky glass. -->
  <div class="shop-appbar">
    <a id="backLink" class="shop-back" href="#" aria-label="Back" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <img id="brandLogo" class="shop-brand-logo" src="" alt="">
    <h1 id="brandName" class="shop-brand">Catalogue</h1>
    <a id="visitLink" class="shop-visit" href="#" target="_blank" rel="noopener" style="display:none;">Visit store</a>
  </div>

  <!-- Loading — skeleton grid (content shape, not a blocking spinner) -->
  <div id="loadingView">
    <div class="shop-grid" aria-hidden="true">
      <div class="skel-card"><div class="skel-media"></div><div class="skel-line"></div><div class="skel-line short"></div><div class="skel-btn"></div></div>
      <div class="skel-card"><div class="skel-media"></div><div class="skel-line"></div><div class="skel-line short"></div><div class="skel-btn"></div></div>
      <div class="skel-card"><div class="skel-media"></div><div class="skel-line"></div><div class="skel-line short"></div><div class="skel-btn"></div></div>
      <div class="skel-card"><div class="skel-media"></div><div class="skel-line"></div><div class="skel-line short"></div><div class="skel-btn"></div></div>
    </div>
  </div>

  <!-- Error -->
  <div id="errorView" class="shop-state" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
    <h2 id="errorTitle" style="margin:0 0 .5rem; color:#fff;">Catalogue unavailable</h2>
    <p id="errorMsg" style="color:rgba(255,255,255,.65);">This brand hasn't enabled catalogue browsing yet.</p>
  </div>

  <!-- Main -->
  <div id="mainView" style="display:none;">
    <div class="shop-controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="searchInput" class="shop-search" placeholder="Search products…" autocomplete="off">
      </div>
      <div class="filter-row" id="audienceRow" style="display:none;">
        <div class="chip-row" id="audienceChips"></div>
      </div>
      <div class="filter-row" id="categoryRow" style="display:none;">
        <div class="chip-row" id="categoryChips"></div>
      </div>
      <div class="shop-toolbar">
        <span class="shop-count" id="resultCount"></span>
        <div class="sort-wrap">
          <span id="sortLabel">Newest</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          <select id="sortSelect" aria-label="Sort products">
            <option value="newest">Newest</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="name">Name A–Z</option>
          </select>
        </div>
      </div>
    </div>

    <div id="grid" class="shop-grid"></div>
    <div id="emptyView" class="shop-empty" style="display:none;">
      <p style="color:rgba(255,255,255,.7); margin:0;">No items match your search or filters.</p>
      <button type="button" id="clearFilters" class="chip">Clear filters</button>
    </div>
  </div>

  <div class="shop-footer">
    Powered by <a href="https://tryinstantfit.com" target="_blank">Try Instant Fit</a>
  </div>

</div>

<script>
  // Same-origin API via Vercel rewrite (see vercel.json).
  const API = '';

  let allItems = [];
  let brand = null;
  const state = { search: '', audience: 'all', category: 'all', sort: 'newest' };

  const GROUP_ORDER = ['Eastern', 'Western', 'Formal & Festive'];
  const AUD_ORDER = ['Women', 'Men', 'Kids', 'Unisex'];

  // Inline SVG icons (no emoji as icons). Stroke follows currentColor.
  const ICON_TRY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>';
  const ICON_BAG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>';
  const ICON_DRESS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>';

  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).style.display = 'block'; }
  function hide(id) { $(id).style.display = 'none'; }
  function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Read brandId from /shop/:brandId (clean URL) or ?brand= fallback.
  function getBrandId() {
    const m = window.location.pathname.match(/\/shop\/([^/?#]+)/);
    if (m) return decodeURIComponent(m[1]);
    return new URLSearchParams(window.location.search).get('brand') || '';
  }

  (async function init() {
    const brandId = getBrandId();
    if (!brandId) return showError('No brand', 'This catalogue link is missing its brand.');

    // Show a Back link when we came from a product page (so browsing feels
    // connected). history.length > 1 means there's somewhere to go back to.
    if (document.referrer || window.history.length > 1) {
      const back = $('backLink');
      back.style.display = 'inline-flex';
      back.addEventListener('click', (e) => { e.preventDefault(); history.back(); });
    }

    try {
      const res = await fetch(`${API}/api/brands/${brandId}/catalog?limit=120`);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) return showError('Catalogue unavailable', "We couldn't load this catalogue.");
      if (data.catalog_enabled === false) return showError('Catalogue is off', 'This brand has turned off catalogue browsing.');
      allItems = Array.isArray(data.products) ? data.products : [];
      brand = data.brand || null;

      renderBrandHeader();
      if (!allItems.length) {
        hide('loadingView');
        showError('Nothing here yet', 'This brand has no items in their catalogue right now.');
        return;
      }
      buildFilters();
      wireControls();
      hide('loadingView');
      show('mainView');
      render();
    } catch (_) {
      showError('Connection error', 'Please check your internet and try again.');
    }
  })();

  // ── Brand theming ──────────────────────────────────────────────────────
  // Parse "#rrggbb" / "#rgb" → {r,g,b}, or null if unusable.
  function parseHex(hex) {
    if (typeof hex !== 'string') return null;
    let h = hex.trim().replace(/^#/, '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
    return { r: parseInt(h.slice(0,2),16), g: parseInt(h.slice(2,4),16), b: parseInt(h.slice(4,6),16) };
  }
  // Readable text colour (black/white) for a given background.
  function contrastOn({r,g,b}) {
    // Perceived luminance (sRGB) — light bg → dark text, dark bg → white text.
    const L = (0.299*r + 0.587*g + 0.114*b) / 255;
    return L > 0.62 ? '#111111' : '#ffffff';
  }
  // Darken a colour by `amt` (0–1) for hover states.
  function darken({r,g,b}, amt) {
    const f = v => Math.max(0, Math.round(v * (1 - amt)));
    return `rgb(${f(r)}, ${f(g)}, ${f(b)})`;
  }

  function applyBrandTheme() {
    const rgb = parseHex(brand?.primary_color);
    if (!rgb) return; // no/invalid colour → keep default TIF theme
    const root = document.documentElement.style;
    const hex = brand.primary_color.trim();
    root.setProperty('--brand', hex);
    root.setProperty('--brand-dark', darken(rgb, 0.18));
    root.setProperty('--brand-contrast', contrastOn(rgb));
  }

  function renderBrandHeader() {
    applyBrandTheme();
    const name = brand?.name || 'Catalogue';
    document.title = `${name} — Try Instant Fit`;
    $('brandName').textContent = name;
    if (brand?.logo_url) {
      const l = $('brandLogo');
      l.src = brand.logo_url;
      l.style.display = 'block';
      l.onerror = () => { l.style.display = 'none'; };
    }
    // "Visit store" link to the brand's own website, if they set one.
    if (brand?.website_url) {
      const v = $('visitLink');
      let url = brand.website_url.trim();
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      v.href = url;
      v.style.display = 'inline-block';
    }
  }

  function buildFilters() {
    // Audience chips
    const auds = Array.from(new Set(allItems.map(p => (p.audience||'').trim()).filter(Boolean)))
      .sort((a,b) => AUD_ORDER.indexOf(a) - AUD_ORDER.indexOf(b));
    if (auds.length > 1) {
      $('audienceChips').innerHTML = [{k:'all',l:'Everyone'}].concat(auds.map(a=>({k:a,l:a})))
        .map(c => `<button type="button" class="chip${state.audience===c.k?' active':''}" data-aud="${escAttr(c.k)}">${esc(c.l)}</button>`).join('');
      show('audienceRow');
      $('audienceChips').querySelectorAll('.chip').forEach(b =>
        b.addEventListener('click', () => { state.audience = b.dataset.aud; state.category = 'all'; rebuildCategoryChips(); render(); syncChips(); }));
    }
    rebuildCategoryChips();
  }

  // Category chips depend on the active audience (so the two narrow together),
  // ordered by style group.
  function rebuildCategoryChips() {
    const pool = state.audience === 'all' ? allItems : allItems.filter(p => (p.audience||'').trim() === state.audience);
    const groupOf = {};
    pool.forEach(p => { const c = (p.category||'').trim(); if (c && !(c in groupOf)) groupOf[c] = (p.category_group||'').trim(); });
    const cats = Object.keys(groupOf).sort((a,b) => {
      const ra = GROUP_ORDER.indexOf(groupOf[a]); const rb = GROUP_ORDER.indexOf(groupOf[b]);
      return (ra===-1?9:ra) - (rb===-1?9:rb) || a.localeCompare(b);
    });
    if (cats.length > 1) {
      $('categoryChips').innerHTML = [{k:'all',l:'All'}].concat(cats.map(c=>({k:c,l:c})))
        .map(c => `<button type="button" class="chip${state.category===c.k?' active':''}" data-cat="${escAttr(c.k)}">${esc(c.l)}</button>`).join('');
      show('categoryRow');
      $('categoryChips').querySelectorAll('.chip').forEach(b =>
        b.addEventListener('click', () => { state.category = b.dataset.cat; render(); syncChips(); }));
    } else {
      hide('categoryRow');
    }
  }

  // Reflect active state on chips without a full rebuild (keeps scroll position).
  function syncChips() {
    document.querySelectorAll('#audienceChips .chip').forEach(b => b.classList.toggle('active', b.dataset.aud === state.audience));
    document.querySelectorAll('#categoryChips .chip').forEach(b => b.classList.toggle('active', b.dataset.cat === state.category));
  }

  function wireControls() {
    $('searchInput').addEventListener('input', (e) => { state.search = e.target.value.trim().toLowerCase(); render(); });
    $('sortSelect').addEventListener('change', (e) => {
      state.sort = e.target.value;
      $('sortLabel').textContent = e.target.options[e.target.selectedIndex].text;
      render();
    });
    $('clearFilters').addEventListener('click', () => {
      state.search = ''; state.audience = 'all'; state.category = 'all';
      $('searchInput').value = '';
      rebuildCategoryChips(); render(); syncChips();
    });
  }

  function fmtPrice(price, currency) {
    if (price === null || price === undefined || price === '') return '';
    const n = Number(price); if (!Number.isFinite(n)) return '';
    const c = currency || 'PKR';
    return c === 'PKR' ? 'Rs ' + n.toLocaleString('en-PK')
      : c === 'USD' ? '$' + n.toFixed(2)
      : `${c} ${n.toLocaleString()}`;
  }

  function currentList() {
    let list = allItems.slice();
    if (state.audience !== 'all') list = list.filter(p => (p.audience||'').trim() === state.audience);
    if (state.category !== 'all') list = list.filter(p => (p.category||'').trim() === state.category);
    if (state.search) list = list.filter(p => (p.name||'').toLowerCase().includes(state.search));
    const num = v => (v === null || v === undefined || v === '') ? Infinity : Number(v);
    switch (state.sort) {
      case 'price_asc':  list.sort((a,b) => num(a.price) - num(b.price)); break;
      case 'price_desc': list.sort((a,b) => num(b.price) - num(a.price)); break;
      case 'name':       list.sort((a,b) => (a.name||'').localeCompare(b.name||'')); break;
      // 'newest' — keep endpoint order (already newest-first)
    }
    return list;
  }

  // Try-on link for an item: prefer its own scan token (proven flow); fall
  // back to the product page by uuid if somehow tokenless.
  function tryOnHref(p) {
    if (p.token) return `/scan/${encodeURIComponent(p.token)}`;
    return `/scan?product=${encodeURIComponent(p.product_uuid)}`;
  }

  function render() {
    const list = currentList();
    $('resultCount').textContent = `${list.length} item${list.length === 1 ? '' : 's'}`;
    const grid = $('grid');
    if (!list.length) { grid.innerHTML = ''; show('emptyView'); return; }
    hide('emptyView');
    grid.innerHTML = list.map((p, i) => {
      const href = escAttr(tryOnHref(p));
      const media = p.image_url
        ? `<img src="${escAttr(p.image_url)}" alt="${escAttr(p.name)}" loading="lazy" onload="this.classList.add('loaded')">`
        : `<span class="ph">${ICON_DRESS}</span>`;
      const price = fmtPrice(p.price, p.currency);
      const cat = (p.category || '').trim();
      const buy = p.buy_url
        ? `<a class="card-btn buy" href="${escAttr(p.buy_url)}" target="_blank" rel="noopener">${ICON_BAG}Buy Now</a>`
        : '';
      return `<div class="card" style="--i:${Math.min(i, 9)}">
        <a class="card-media" href="${href}" aria-label="Try on ${escAttr(p.name)}">${media}</a>
        <div class="card-body">
          ${cat ? `<p class="card-cat">${esc(cat)}</p>` : ''}
          <a href="${href}" style="text-decoration:none;"><p class="card-name">${esc(p.name || 'Product')}</p></a>
          ${price ? `<p class="card-price">${price}</p>` : ''}
          <div class="card-actions">
            <a class="card-btn try" href="${href}">${ICON_TRY}Try On</a>
            ${buy}
          </div>
        </div>
      </div>`;
    }).join('');
    // Images already in the browser cache can fire `load` before the inline
    // handler is attached — mark those visible immediately.
    grid.querySelectorAll('.card-media img').forEach(im => { if (im.complete) im.classList.add('loaded'); });
  }

  function showError(title, msg) {
    hide('loadingView'); hide('mainView');
    $('errorTitle').textContent = title;
    $('errorMsg').textContent = msg;
    show('errorView');
  }
</script>

</body>
</html>
